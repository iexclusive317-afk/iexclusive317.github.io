<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบแจ้งยอดโรงหนัง</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* --- โครงสร้าง Style เดิมทั้งหมด --- */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans Thai', 'Segoe UI', sans-serif; background: #1e1e1e; color: white; padding: 20px; min-height: 100vh; }
h1 { text-align: center; color: #facc15; font-size: 24px; margin-bottom: 6px; }
.subtitle { text-align: center; color: #888; font-size: 13px; margin-bottom: 20px; }

.date-bar { background: #2a2a2a; padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: center; align-items: center; gap: 15px; border: 1px solid #444; }
.date-bar label { font-size: 14px; color: #facc15; font-weight: bold; }
.date-bar input[type="date"] { background: #1e1e1e; color: #facc15; border: 1px solid #facc15; padding: 8px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }

.tabs { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; }
.tab-btn { padding: 8px 24px; border: none; border-radius: 20px; cursor: pointer; font-family: 'Noto Sans Thai', sans-serif; font-size: 13px; font-weight: 600; background: #333; color: #aaa; transition: all 0.2s; }
.tab-btn.active { background: #facc15; color: #000; }
.page { display: none; }
.page.active { display: block; }

.box { background: #2a2a2a; padding: 20px; border-radius: 15px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.field-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 140px; }
.field-group label { font-size: 11px; color: #aaa; padding-left: 2px; }
input, select { padding: 10px 12px; border: 1px solid #444; border-radius: 8px; outline: none; background: #1e1e1e; color: white; font-family: 'Noto Sans Thai', sans-serif; font-size: 13px; width: 100%; transition: border 0.2s; }
input:focus, select:focus { border-color: #facc15; }
.addBtn { padding: 10px 24px; border: none; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; font-family: 'Noto Sans Thai', sans-serif; font-size: 14px; background: #22c55e; transition: background 0.2s; align-self: flex-end; white-space: nowrap; }
.deleteBtn { background: #ef4444; border: none; border-radius: 6px; cursor: pointer; color: white; font-weight: bold; padding: 5px 12px; font-size: 12px; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 20px; }
.stat { background: #2a2a2a; border-radius: 10px; padding: 14px; text-align: center; border-top: 3px solid transparent; }
.stat.s-yellow { border-top-color: #facc15; }
.stat.s-green { border-top-color: #22c55e; }
.stat.s-blue { border-top-color: #3b82f6; }
.stat.s-red { border-top-color: #ef4444; }
.stat-label { font-size: 10px; color: #888; margin-bottom: 4px; }
.stat-val { font-size: 20px; font-weight: 700; color: #facc15; }
.stat-sub { font-size: 10px; color: #666; }

.filter-bar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
.fbtn { padding: 4px 14px; border-radius: 16px; border: 1px solid #444; cursor: pointer; font-size: 12px; background: #2a2a2a; color: #aaa; }
.fbtn.active { background: #facc15; color: #000; border-color: #facc15; }
.table-container { overflow-x: auto; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
table { width: 100%; border-collapse: collapse; background: white; color: black; min-width: 600px; }
th { background: #16a34a; color: white; padding: 10px 12px; font-size: 12px; }
td { border: 1px solid #ddd; padding: 10px 12px; text-align: center; }
.region-bkk { background: #dbeafe !important; }
.region-peri { background: #fef9c3 !important; }
.region-cnx { background: #fce7f3 !important; }

.comp-box { background: #2a2a2a; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
.comp-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
.comp-header h3 { font-size: 14px; color: #facc15; }
.btn-add-movie { background: #3b82f6; color: white; border: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
.movie-name-inputs { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.movie-input-wrap { display: flex; gap: 5px; align-items: center; background: #1e1e1e; padding: 5px; border-radius: 8px; border: 1px solid #333; }
.movie-input-wrap input { border: none; padding: 8px; }
.btn-remove-movie { background: #ef4444; color: white; border: none; width: 25px; height: 25px; border-radius: 5px; cursor: pointer; font-size: 10px; }
</style>
</head>
<body>

<div class="tabs">

<div id="p2" class="page">
    <div class="comp-box">
        <div class="comp-header">
            <h3>✏️ จัดการรายชื่อภาพยนตร์ข้างเคียง</h3>
            <button class="btn-add-movie" onclick="addNewMovieSlot()">➕ เพิ่มเรื่องใหม่</button>
        </div>
        <div class="movie-name-inputs" id="compMovieInputs"></div>
    </div>
    
    <div class="box">
        <div class="field-group"><label>สาขา</label><select id="c-branch"></select></div>
        <div class="field-group"><label>ภาพยนตร์</label><select id="c-movie"></select></div>
        <div class="field-group"><label>ระบบ</label>
            <select id="c-sys">
                <option>2D/TH</option><option>2D/EN</option><option>IMAX</option><option>4DX</option>
            </select>
        </div>
        <div class="field-group"><label>รอบ 14:00 (เงิน)</label><input type="number" id="c-i14"></div>
        <div class="field-group"><label>รอบ 14:00 (ที่)</label><input type="number" id="c-s14"></div>
        <div class="field-group"><label>รอบ 16:30 (เงิน)</label><input type="number" id="c-i16"></div>
        <div class="field-group"><label>รอบ 16:30 (ที่)</label><input type="number" id="c-s16"></div>
        <button class="addBtn" onclick="addComp()">➕ เพิ่มข้อมูล</button>
    </div>
    <div class="stats" id="stats2"></div>
    <div class="table-container">
        <table>
            <thead><tr><th>#</th><th>สาขา</th><th>โซน</th><th>ภาพยนตร์</th><th>ระบบ</th><th>14:00(เงิน)</th><th>14:00(ที่)</th><th>16:30(เงิน)</th><th>16:30(ที่)</th><th>รวมเงิน</th><th>ลบ</th></tr></thead>
            <tbody id="compTableData"></tbody>
        </table>
    </div>
</div>

<script>
/* --- Logic ทั้งหมดห้ามลบโค้ดเดิม --- */
let fullDatabase = JSON.parse(localStorage.getItem('cinema_master_db')) || {};
let currentDay = ""; 
let compMovies = JSON.parse(localStorage.getItem('comp_movies_list')) || ["Mortal Kombat 2", "Billie Eilish", "Ghost in The Cell"];

let data1 = [];
let data2 = [];
let filter1 = 'all';

const REGION_LABEL = { bkk: '🏙 กรุงเทพฯ', peri: '🏢 ปริมณฑล', cnx: '🏔 เชียงใหม่' };
const REGION_CLASS = { bkk: 'region-bkk', peri: 'region-peri', cnx: 'region-cnx' };

function init() {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('selectedDate').value = today;
    currentDay = today;
    loadDayData(today);
    // อัปเดตรายชื่อสาขาหน้า 2 ให้เหมือนหน้า 1
    document.getElementById('c-branch').innerHTML = document.getElementById('branch').innerHTML;
    buildCompMovieInputs();
    renderAll();
}

function changeDate() {
    const newDate = document.getElementById('selectedDate').value;
    if(!newDate) return;
    saveToMaster();
    currentDay = newDate;
    loadDayData(newDate);
    renderAll();
}

function loadDayData(date) {
    if (fullDatabase[date]) {
        data1 = fullDatabase[date].data1 || [];
        data2 = fullDatabase[date].data2 || [];
    } else {
        data1 = []; data2 = [];
    }
}

function saveToMaster() {
    fullDatabase[currentDay] = { data1: data1, data2: data2 };
    localStorage.setItem('cinema_master_db', JSON.stringify(fullDatabase));
    localStorage.setItem('comp_movies_list', JSON.stringify(compMovies));
}

// ฟังก์ชันเพิ่ม-ลบชื่อหนังข้างเคียง (ตามคำขอ)
function addNewMovieSlot() {
    compMovies.push("ระบุชื่อหนังใหม่");
    saveToMaster();
    buildCompMovieInputs();
}

function removeMovieSlot(idx) {
    if(compMovies.length <= 1) return;
    if(confirm("ลบรายชื่อหนัง?")) {
        compMovies.splice(idx, 1);
        saveToMaster();
        buildCompMovieInputs();
        renderTable2();
    }
}

function buildCompMovieInputs() {
    document.getElementById('compMovieInputs').innerHTML = compMovies.map((m, i) => `
        <div class="movie-input-wrap">
            <input type="text" value="${m}" oninput="compMovies[${i}]=this.value; saveToMaster(); updateCompMovieSelect(); renderTable2()">
            <button class="btn-remove-movie" onclick="removeMovieSlot(${i})">✕</button>
        </div>
    `).join('');
    updateCompMovieSelect();
}

function updateCompMovieSelect() {
    const sel = document.getElementById('c-movie');
    const cur = sel.value;
    sel.innerHTML = compMovies.map(m => `<option value="${m}">${m}</option>`).join('');
    if (cur && compMovies.includes(cur)) sel.value = cur;
}

// --- ฟังก์ชันหลักอื่นๆ ---
function renderAll() { renderTable1(); renderTable2(); }

function addData() {
    const movie = document.getElementById('movieName').value;
    const branchVal = document.getElementById('branch').value;
    const sys = document.getElementById('sys').value;
    const roundTime = document.getElementById('roundTime').value;
    const seats = parseInt(document.getElementById('seats').value) || 0;
    const money = parseFloat(document.getElementById('money').value) || 0;
    const [branchName, region] = branchVal.split('|');
    data1.push({ movie, branchName, region, sys, roundTime, theaterNo: document.getElementById('theaterNo').value, seats, money });
    saveToMaster(); renderTable1();
}

function addComp() {
    const branchVal = document.getElementById('c-branch').value;
    const movie = document.getElementById('c-movie').value;
    const [branchName, region] = branchVal.split('|');
    data2.push({ 
        branchName, region, movie, sys: document.getElementById('c-sys').value,
        i14: parseFloat(document.getElementById('c-i14').value) || 0,
        s14: parseInt(document.getElementById('c-s14').value) || 0,
        i16: parseFloat(document.getElementById('c-i16').value) || 0,
        s16: parseInt(document.getElementById('c-s16').value) || 0
    });
    saveToMaster(); renderTable2();
}

function deleteRow1(idx) { data1.splice(idx, 1); saveToMaster(); renderTable1(); }
function deleteRow2(idx) { data2.splice(idx, 1); saveToMaster(); renderTable2(); }

function renderTable1() {
    const filtered = filter1 === 'all' ? data1 : data1.filter(d => d.region === filter1);
    const tbody = document.getElementById('tableData');
    tbody.innerHTML = filtered.map((d, i) => `
        <tr class="${REGION_CLASS[d.region]}">
            <td>${i + 1}</td><td><strong>${d.movie}</strong></td><td>${d.branchName}</td>
            <td>${REGION_LABEL[d.region]}</td><td>${d.sys}</td><td>${d.theaterNo}</td>
            <td>${d.roundTime}</td><td>${d.seats}</td><td>${d.money.toLocaleString()}</td>
            <td><button class="deleteBtn" onclick="deleteRow1(${data1.indexOf(d)})">ลบ</button></td>
        </tr>`).join('');
    updateStats1();
}

function renderTable2() {
    const tbody = document.getElementById('compTableData');
    tbody.innerHTML = data2.map((d, i) => `
        <tr class="${REGION_CLASS[d.region]}">
            <td>${i+1}</td><td>${d.branchName}</td><td>${REGION_LABEL[d.region]}</td><td>${d.movie}</td><td>${d.sys}</td>
            <td>${d.i14.toLocaleString()}</td><td>${d.s14}</td>
            <td>${d.i16.toLocaleString()}</td><td>${d.s16}</td>
            <td><strong>${(d.i14 + d.i16).toLocaleString()}</strong></td>
            <td><button class="deleteBtn" onclick="deleteRow2(${i})">ลบ</button></td>
        </tr>`).join('');
    updateStats2();
}

function updateStats1() {
    document.getElementById('s-money').textContent = data1.reduce((s, d) => s + d.money, 0).toLocaleString();
    document.getElementById('s-seats').textContent = data1.reduce((s, d) => s + d.seats, 0).toLocaleString();
    document.getElementById('s-count').textContent = data1.length;
}

function updateStats2() {
    const statsDiv = document.getElementById('stats2');
    const movieTotals = compMovies.map(m => {
        const rows = data2.filter(d => d.movie === m);
        return { name: m, inc: rows.reduce((s, d) => s + d.i14 + d.i16, 0) };
    });
    statsDiv.innerHTML = movieTotals.map(t => t.inc > 0 ? `<div class="stat s-blue"><div class="stat-label">${t.name}</div><div class="stat-val">${t.inc.toLocaleString()}</div></div>` : "").join('');
}

function showPage(id, el) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
    document.getElementById(id).classList.add('active'); el.classList.add('active');
}
function filterTable(r, el) { filter1 = r; document.querySelectorAll('#p1 .fbtn').forEach(b => b.classList.remove('active')); el.classList.add('active'); renderTable1(); }

init();
</script>
