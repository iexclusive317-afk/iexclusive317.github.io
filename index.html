<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinema Management - Clean UI</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans Thai', sans-serif; background: #121212; color: #e0e0e0; padding: 15px; min-height: 100vh; }
    .header-section { text-align: center; margin-bottom: 20px; }
    
    .filter-card { background: #1e1e1e; padding: 15px; border-radius: 12px; border: 1px solid #333; margin-bottom: 15px; }
    .filter-card label { display: block; margin-bottom: 8px; color: #facc15; font-weight: bold; font-size: 14px; }
    
    .branch-selector-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    select, input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: white; font-size: 14px; outline: none; }
    input:focus, select:focus { border-color: #facc15; }
    
    .btn-reset { background: #444; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 12px; width: 100%; margin-top: 8px; font-weight: bold; }

    .status-selector { display: flex; gap: 5px; margin-bottom: 10px; }
    .status-btn { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #444; cursor: pointer; text-align: center; font-weight: bold; font-size: 12px; background: #333; color: #888; }
    .status-btn.active.pre { background: #ef4444; color: white; border-color: #ef4444; }
    .status-btn.active.real { background: #22c55e; color: white; border-color: #22c55e; }
    
    .tabs { display: flex; gap: 5px; margin-bottom: 15px; }
    .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; background: #333; color: #888; cursor: pointer; font-weight: bold; }
    .tab-btn.active { background: #facc15; color: #000; }
    
    .page { display: none; }
    .page.active { display: block; }
    .box { background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #333; }
    
    .total-summary-box { background: #1e1e1e; border: 1px solid #facc15; border-radius: 12px; padding: 15px; margin-bottom: 15px; overflow-x: auto; }
    .summary-table { width: 100%; border-collapse: collapse; font-size: 12px; color: #eee; min-width: 500px; }
    .summary-table th { background: #333; color: #facc15; padding: 10px; text-align: left; border: 1px solid #444; }
    .summary-table td { padding: 8px 10px; border: 1px solid #444; background: #262626; }

    .table-container { overflow-x: auto; background: #fff; border-radius: 10px; }
    table { width: 100%; border-collapse: collapse; color: #333; font-size: 12px; min-width: 950px; }
    th { background: #333; color: white; padding: 12px; }
    td { padding: 10px; border-bottom: 1px solid #eee; text-align: center; }
    .row-pre { color: #ef4444; font-weight: bold; }
    .row-real { color: #16a34a; font-weight: bold; }
    .btn-add { background: #3b82f6; color: white; border: none; padding: 15px; border-radius: 8px; width: 100%; font-weight: bold; margin-top: 10px; cursor: pointer; }
    .movie-tag { background: #333; padding: 5px 10px; border-radius: 20px; font-size: 11px; display: inline-flex; align-items: center; gap: 6px; margin: 2px; border: 1px solid #444; }
</style>
</head>
<body>

<div class="header-section">
    <h2 style="color:#facc15">Cinema Management</h2>
    <input type="date" id="targetDate" onchange="loadData()" style="width: auto; margin-top: 10px; border-color: #facc15;">
</div>

<div class="filter-card">
    <label>🏢 ค้นหาหรือเลือกจากกลุ่มสาขา</label>
    <div class="branch-selector-grid">
        <div class="search-box">
            <input list="branchList" id="branchInput" placeholder="🔍 พิมพ์ค้นหาสาขา..." oninput="syncDropdown()">
            <datalist id="branchList"></datalist>
        </div>
        <select id="branchDropdown" onchange="syncSearch()">
            <option value="">-- เลือกจากโซน --</option>
            <optgroup label="📍 รัตนาธิเบศร์-ติวานนท์-แจ้งวัฒนะ">
                <option>ESPLANADE RATTANATIBATE</option>
                <option>MAJOR CINEPLEX CHARN CHANGWATTHANA</option>
                <option>MAJOR HOLLYWOOD CHANGWATTHANA</option>
                <option>MAJOR CINEPLEX TIWANON</option>
                <option>SF CINEMA CENTRAL CHAENGWATTANA</option>
                <option>SF CINEMA ROBINSON SRISAMAN</option>
            </optgroup>
            <optgroup label="📍 เชียงใหม่">
                <option>MAJOR CINEPLEX FESTIVAL CHIANGMAI</option>
                <option>MAJOR CINEPLEX AIRPORT CHIANGMAI</option>
                <option>SF CINEMA MAYA CHIANGMAI</option>
            </optgroup>
            <optgroup label="📍 เพชรเกษม-บางแค">
                <option>MAJOR CINEPLEX PETCHAKASEM</option>
                <option>SF CINEMA THE MALL BANGKAE</option>
                <option>SF CINEMA BIG C PETCHAKASEM</option>
                <option>EGV SEACON BANGKAE ( 10 )</option>
            </optgroup>
            <optgroup label="📍 รัชโยธิน-เลียบด่วน-รามอินทรา">
                <option>MAJOR CINEPLLEX RATCHAYOTHIN</option>
                <option>MAJOR EASTVILLE</option>
                <option>SFX THE CRYSTAL EKAMAI-RAMINTRA</option>
                <option>SF CINEMA RAMINTRA</option>
                <option>MAJOR PROMENADE (8)</option>
                <option>MAJOR CINEPLEX FASHION ( 11 )</option>
            </optgroup>
            <optgroup label="📍 เวสต์เกต-ราชพฤกษ์">
                <option>MAJOR CENTRAL WESTGATE</option>
                <option>SF CINEMA COSMO BAZAAR</option>
                <option>MAJOR ROBINSON RATCHAPRUK</option>
                <option>WESTVILLE</option>
                <option>SF CINEMA THE CRYSTAL RATCHAPRUEK</option>
                <option>MAJOR CINEPLEX LOTUS BANGYAI</option>
            </optgroup>
            <optgroup label="📍 สมุทรปราการ-บางพลี">
                <option>MAJOR CINEPLEX SAMRONG</option>
                <option>MAJOR CINEPLEX SAMUTPRAKARN</option>
                <option>EGV BIG C SAMUTPRAKARN</option>
                <option>SF CINEMA BIG C BANGPLEE</option>
                <option>SF CINEMA MARKET VILLAGE SUVARNABHUMI</option>
                <option>MAJOR CINEPLEX MEGA BANGNA</option>
                <option>MAJOR CINEPLEX LOTUS SAMUTPRAKARN</option>
            </optgroup>
            <optgroup label="📍 ปิ่นเกล้า-ริมน้ำ-ฝั่งธน">
                <option>ICON</option>
                <option>MAJOR CINEPLEX RAMA3</option>
                <option>SF CINEMA TERMINAL 21 RAMA 3</option>
                <option>EMBASSY</option>
                <option>EGV PINKLAO ( 11 )</option>
                <option>MAJOR CINEPLEX PINKLAO ( 13 )</option>
                <option>MAJOR BIC C SUKSAWAD (12)</option>
                <option>MAJOR CINEPLEX RAMR2</option>
                <option>MAJOR CINEPLEX LOTUS RAMA2</option>
                <option>MAJOR CINEPLEX LOTUS BANGPRAKOK</option>
                <option>SF CINEMA THE MALL TAPRA</option>
            </optgroup>
            <optgroup label="📍 สยาม-สุขุมวิท-ใจกลางเมือง">
                <option>PARAGON CINEPLEX</option>
                <option>ONE ULTRA SCREEN</option>
                <option>SF CINEMA MBK CENTER</option>
                <option>SF WORLD CINEMA CENTRAL WORLD</option>
                <option>QUARTIER CINEART</option>
                <option>MAJOR CINEPLEX SUKHUMVIT</option>
                <option>SF CINEMA TERMINAL 21</option>
                <option>SF EMPREVE' CINECLUB</option>
            </optgroup>
            <optgroup label="📍 รังสิต-ปทุม-งามวงศ์วาน">
                <option>EGV RANGSIT</option>
                <option>MAJOR CINEPLEX RANGSIT KLONG6</option>
                <option>MAJOR CINE PLEX LOTUS NAWANAKORN</option>
                <option>SFX CINEMA THE MALL NGAMWONGWAN</option>
                <option>MAJOR CINEPLEX RANGSIT</option>
                <option>MAJOR CINEPLEX PATUMTANI</option>
                <option>MAJOR BANGKADI</option>
            </optgroup>
            <optgroup label="📍 รัชดา-ลาดพร้าว-บางกะปิ">
                <option>ESPLANADE RATCHADA</option>
                <option>MAJOR GATEWAY BANGSUE</option>
                <option>SFX CINEMA CENTRAL LADPLAO</option>
                <option>SFX CINEMA CENTRAL RAMA9</option>
                <option>MAJOR CINEPLEX SAMSEN</option>
                <option>MAJOR CINEPLEX LOTUS BANGKAPI</option>
                <option>MAJOR CINEPLEX CENTRAL BANGNA</option>
                <option>BANGKAPI CINEPLEX (THE MALL BANGKAPI)</option>
                <option>MAJOR CINEPLEX LOTUS SRINAKARIN</option>
                <option>EGV SEACON</option>
                <option>SF CINEMA JAS URBAN SRINAKARIN</option>
                <option>MAJOR ROBINSON LADKRABUNG</option>
            </optgroup>
        </select>
    </div>
    <button class="btn-reset" onclick="resetBranch()">📊 ดูยอดรวมทุกสาขา</button>
</div>

<div id="advancedSummary" class="total-summary-box">
    <h4 id="summaryTitle" style="color:#facc15; margin-bottom:10px">📈 สรุปยอดรวม</h4>
    <table class="summary-table">
        <thead><tr><th>ชื่อภาพยนตร์</th><th>ระบบ/เสียง</th><th style="text-align:right">ยอดรวม (บาท)</th></tr></thead>
        <tbody id="summarySplitBody"></tbody>
    </table>
</div>

<div class="tabs">
    <button class="tab-btn active" id="tab1" onclick="switchPage(1)">รายได้หลัก</button>
    <button class="tab-btn" id="tab2" onclick="switchPage(2)">ยอดข้างเคียง</button>
</div>

<div class="box" id="movieManagerBox">
    <div style="display:flex; gap:5px; margin-bottom:10px">
        <input type="text" id="new_movie_main" placeholder="เพิ่มหนังหลัก...">
        <button onclick="addMovie('main')" style="background:#3b82f6; border:none; padding:10px; border-radius:8px; color:white; width: 60px;">เพิ่ม</button>
    </div>
    <div id="list_tags_main" style="margin-bottom:15px"></div>
    <hr style="border-color:#333; margin: 15px 0;">
    <div style="display:flex; gap:5px; margin-bottom:10px">
        <input type="text" id="new_movie_side" placeholder="เพิ่มหนังรอง...">
        <button onclick="addMovie('side')" style="background:#22c55e; border:none; padding:10px; border-radius:8px; color:white; width: 60px;">เพิ่ม</button>
    </div>
    <div id="list_tags_side"></div>
</div>

<div id="p1" class="page active">
    <div class="box" id="inputBox1">
        <div class="status-selector">
            <div id="st-pre-1" class="status-btn active pre" onclick="setStatus(1,'PRE')">ยอดเบื้องต้น</div>
            <div id="st-real-1" class="status-btn real" onclick="setStatus(1,'REAL')">ปิดยอดจริง</div>
        </div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px">
            <select id="m_name_sel"></select>
            <select id="m_sys"><option>2D/TH</option><option>2D/EN</option><option>IMAX</option><option>4DX</option></select>
            <input type="number" id="m_the" placeholder="โรง">
            <input type="text" id="m_time" placeholder="เวลา">
            <input type="number" id="m_money" placeholder="ยอดเงิน">
            <input type="number" id="m_seat" placeholder="ที่นั่ง">
        </div>
        <button class="btn-add" onclick="saveData(1)">บันทึกรายได้หลัก</button>
    </div>
    <div class="table-container"><table><thead><tr><th>สถานะ</th><th>สาขา</th><th>หนัง</th><th>ระบบ</th><th>โรง</th><th>เวลา</th><th>เงิน</th><th>ลบ</th></tr></thead><tbody id="tbody1"></tbody></table></div>
</div>

<div id="p2" class="page">
    <div class="box" id="inputBox2">
        <div class="status-selector">
            <div id="st-pre-2" class="status-btn active pre" onclick="setStatus(2,'PRE')">ยอดเบื้องต้น</div>
            <div id="st-real-2" class="status-btn real" onclick="setStatus(2,'REAL')">ปิดยอดจริง</div>
        </div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px">
            <select id="c_movie_sel"></select>
            <input type="number" id="c_the" placeholder="โรง">
            <input type="number" id="c_rounds" placeholder="รอบ">
            <input type="number" id="c_income" placeholder="รายได้">
            <input type="number" id="c_view" placeholder="ผู้ชม">
        </div>
        <button class="btn-add" onclick="saveData(2)" style="background:#22c55e">บันทึกยอดข้างเคียง</button>
    </div>
    <div class="table-container"><table><thead><tr><th>สถานะ</th><th>สาขา</th><th>หนัง</th><th>โรง</th><th>รอบ</th><th>เงิน</th><th>ผู้ชม</th><th>ลบ</th></tr></thead><tbody id="tbody2"></tbody></table></div>
</div>

<script>
const firebaseConfig = { apiKey: "AIzaSyBGDiT7wGEnigYpAp7Q3nUNiLNHtcKYEDI", authDomain: "newnane-fe1b7.firebaseapp.com", databaseURL: "https://newnane-fe1b7-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "newnane-fe1b7", storageBucket: "newnane-fe1b7.firebasestorage.app", messagingSenderId: "227043707783", appId: "1:227043707783:web:24b4c5b0e9f53e5661a122" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let rawP1 = [], rawP2 = [], moviesM = [], moviesS = [];
let stt1 = 'PRE', stt2 = 'PRE';

function init() {
    const dropdown = document.getElementById('branchDropdown');
    const datalist = document.getElementById('branchList');
    let opts = '';
    for (let i = 0; i < dropdown.options.length; i++) if(dropdown.options[i].value) opts += `<option value="${dropdown.options[i].value}">`;
    datalist.innerHTML = opts;
    document.getElementById('targetDate').value = new Date().toISOString().split('T')[0];
    db.ref('settings/movies_main').on('value', s => { moviesM = s.val()||[]; updateMovieLists(); loadData(); });
    db.ref('settings/movies_side').on('value', s => { moviesS = s.val()||[]; updateMovieLists(); loadData(); });
}

function syncSearch() { document.getElementById('branchInput').value = document.getElementById('branchDropdown').value; renderAll(); }
function syncDropdown() {
    const val = document.getElementById('branchInput').value.toUpperCase();
    const dd = document.getElementById('branchDropdown');
    dd.value = ""; 
    for (let i = 0; i < dd.options.length; i++) if(dd.options[i].value === val) { dd.value = val; break; }
    renderAll();
}
function resetBranch() { document.getElementById('branchInput').value = ""; document.getElementById('branchDropdown').value = ""; renderAll(); }

function loadData() {
    const d = document.getElementById('targetDate').value;
    db.ref('data/'+d).on('value', s => {
        const v = s.val()||{};
        rawP1 = v.p1 || []; rawP2 = v.p2 || [];
        renderAll();
    });
}

function renderAll() {
    const search = document.getElementById('branchInput').value.trim().toUpperCase();
    const isTotal = (search === "");
    const activeTab = document.getElementById('tab1').classList.contains('active') ? 1 : 2;

    document.getElementById('movieManagerBox').style.display = isTotal ? 'block' : 'none';
    document.getElementById('inputBox1').style.display = isTotal ? 'none' : 'block';
    document.getElementById('inputBox2').style.display = isTotal ? 'none' : 'block';

    let h1 = '', h2 = '', splitMain = {}, splitSide = {};
    const filteredP1 = isTotal ? rawP1 : rawP1.filter(x => x.b.toUpperCase() === search);
    const filteredP2 = isTotal ? rawP2 : rawP2.filter(x => x.b.toUpperCase() === search);

    filteredP1.forEach((d, i) => {
        if(isTotal) {
            if(!splitMain[d.n]) splitMain[d.n] = {};
            splitMain[d.n][d.s] = (splitMain[d.n][d.s] || 0) + (d.m || 0);
        }
        h1 += `<tr class="${d.stt==='REAL'?'row-real':'row-pre'}">
            <td>${d.stt==='REAL'?'จริง':'เบื้องต้น'}</td><td>${d.b}</td><td>${d.n}</td><td>${d.s}</td>
            <td>${d.the || '-'}</td><td>${d.tm || '-'}</td><td>${(d.m||0).toLocaleString()}</td>
            <td><button onclick="delItem('p1',${i})">✕</button></td></tr>`;
    });

    filteredP2.forEach((d, i) => {
        if(isTotal) {
            if(!splitSide[d.n]) splitSide[d.n] = {};
            splitSide[d.n]['ทั่วไป'] = (splitSide[d.n]['ทั่วไป'] || 0) + (d.i || 0);
        }
        h2 += `<tr class="${d.stt==='REAL'?'row-real':'row-pre'}">
            <td>${d.stt==='REAL'?'จริง':'เบื้องต้น'}</td><td>${d.b}</td><td>${d.n}</td>
            <td>${d.the || '-'}</td><td>${d.r || '-'}</td><td>${(d.i||0).toLocaleString()}</td><td>${d.v||0}</td>
            <td><button onclick="delItem('p2',${i})">✕</button></td></tr>`;
    });

    document.getElementById('tbody1').innerHTML = h1;
    document.getElementById('tbody2').innerHTML = h2;

    if(isTotal) {
        let cur = (activeTab === 1) ? splitMain : splitSide;
        document.getElementById('summaryTitle').innerText = (activeTab===1)?"🎬 สรุปรายได้หลัก (รวม)":"🍿 สรุปยอดข้างเคียง (รวม)";
        let sHtml = '';
        Object.keys(cur).sort().forEach(m => {
            let sys = cur[m], keys = Object.keys(sys), total = 0;
            keys.forEach((s, i) => { total += sys[s]; sHtml += `<tr>${i===0?`<td rowspan="${keys.length+1}">${m}</td>`:''}<td>${s}</td><td style="text-align:right">${sys[s].toLocaleString()}</td></tr>`; });
            sHtml += `<tr class="movie-total-row"><td colspan="2" style="text-align:right">รวม ${m}</td><td style="text-align:right">${total.toLocaleString()}</td></tr>`;
        });
        document.getElementById('summarySplitBody').innerHTML = sHtml || '<tr><td colspan="3" style="text-align:center">ไม่มีข้อมูล</td></tr>';
    }
}

function updateMovieLists() {
    document.getElementById('m_name_sel').innerHTML = moviesM.map(m => `<option>${m}</option>`).join('');
    document.getElementById('c_movie_sel').innerHTML = moviesS.map(m => `<option>${m}</option>`).join('');
    document.getElementById('list_tags_main').innerHTML = moviesM.map((m,i)=>`<span class="movie-tag">${m} <b onclick="removeMovie('main',${i})" style="color:red;cursor:pointer">✕</b></span>`).join(' ');
    document.getElementById('list_tags_side').innerHTML = moviesS.map((m,i)=>`<span class="movie-tag">${m} <b onclick="removeMovie('side',${i})" style="color:red;cursor:pointer">✕</b></span>`).join(' ');
}

function sync() { db.ref('data/'+document.getElementById('targetDate').value).set({ p1: rawP1, p2: rawP2 }); }
function setStatus(p, s) { if(p===1) stt1=s; else stt2=s; document.getElementById('st-pre-'+p).classList.toggle('active', s==='PRE'); document.getElementById('st-real-'+p).classList.toggle('active', s==='REAL'); }
function switchPage(p) { document.getElementById('tab1').classList.toggle('active', p===1); document.getElementById('tab2').classList.toggle('active', p===2); document.getElementById('p1').classList.toggle('active', p===1); document.getElementById('p2').classList.toggle('active', p===2); renderAll(); }
function delItem(p, i) { if(confirm("ลบ?")) { if(p==='p1') rawP1.splice(i,1); else rawP2.splice(i,1); sync(); } }
function addMovie(t) { const i = document.getElementById('new_movie_'+t); if(i.value) { if(t==='main') moviesM.push(i.value); else moviesS.push(i.value); db.ref('settings/movies_'+t).set(t==='main'?moviesM:moviesS); i.value=''; } }
function removeMovie(t, i) { if(t==='main') moviesM.splice(i,1); else moviesS.splice(i,1); db.ref('settings/movies_'+t).set(t==='main'?moviesM:moviesS); }

function saveData(p) {
    const b = document.getElementById('branchInput').value.trim();
    if(!b) return alert("เลือกสาขาก่อน");
    if(p===1) rawP1.push({ b, n: document.getElementById('m_name_sel').value, s: document.getElementById('m_sys').value, the: document.getElementById('m_the').value, tm: document.getElementById('m_time').value, m: parseFloat(document.getElementById('m_money').value)||0, stt: stt1 });
    else rawP2.push({ b, n: document.getElementById('c_movie_sel').value, the: document.getElementById('c_the').value, r: document.getElementById('c_rounds').value, i: parseFloat(document.getElementById('c_income').value)||0, v: parseInt(document.getElementById('c_view').value)||0, stt: stt2 });
    sync();
}

init();
</script>
</body>
</html>
