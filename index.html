<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinema Management - Multi-Branch Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans Thai', sans-serif; background: #121212; color: #e0e0e0; padding: 15px; min-height: 100vh; }
    #login-page { display: flex; flex-direction: column; align-items: center; justify-content: center; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #121212; z-index: 9999; }
    .login-box { background: #1e1e1e; padding: 30px; border-radius: 15px; border: 1px solid #facc15; width: 320px; text-align: center; }
    .login-box h2 { color: #facc15; margin-bottom: 20px; }
    .login-box input { margin-bottom: 15px; width: 100%; padding: 12px; border-radius: 8px; background: #2a2a2a; color: white; border: 1px solid #444; outline: none; }
    .btn-login { background: #facc15; color: black; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; }
    #main-content { display: none; }
    .logout-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 5px 0; }
    .btn-logout { background: #ff4444; color: white; border: none; padding: 5px 12px; border-radius: 5px; cursor: pointer; font-size: 12px; }
    .header-section { text-align: center; margin-bottom: 20px; }
    .filter-card { background: #1e1e1e; padding: 15px; border-radius: 12px; border: 1px solid #333; margin-bottom: 15px; }
    .filter-card label { display: block; margin-bottom: 8px; color: #facc15; font-weight: bold; font-size: 14px; }
    .branch-selector-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    select, input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: white; font-size: 14px; outline: none; }
    .btn-reset { background: #444; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 12px; width: 100%; margin-top: 8px; font-weight: bold; }
    .status-selector { display: flex; gap: 5px; margin-bottom: 10px; }
    .status-btn { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #444; cursor: pointer; text-align: center; font-weight: bold; font-size: 12px; background: #333; color: #888; }
    .status-btn.active.pre { background: #ef4444; color: white; border-color: #ef4444; }
    .status-btn.active.real { background: #22c55e; color: white; border-color: #22c55e; }
    .tabs { display: flex; gap: 5px; margin-bottom: 15px; }
    .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; background: #333; color: #888; cursor: pointer; font-weight: bold; }
    .tab-btn.active { background: #facc15; color: #000; }
    .page { display: none; }
    .page.active { display: block; }
    .box { background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #333; }
    .total-summary-box { background: #1e1e1e; border: 1px solid #facc15; border-radius: 12px; padding: 15px; margin-bottom: 15px; overflow-x: auto; }
    .summary-table { width: 100%; border-collapse: collapse; font-size: 12px; color: #eee; min-width: 500px; }
    .summary-table th { background: #333; color: #facc15; padding: 10px; text-align: left; border: 1px solid #444; }
    .summary-table td { padding: 8px 10px; border: 1px solid #444; background: #262626; }
    .table-container { overflow-x: auto; background: #fff; border-radius: 10px; }
    table { width: 100%; border-collapse: collapse; color: #333; font-size: 12px; min-width: 1000px; }
    th { background: #333; color: white; padding: 12px; }
    td { padding: 10px; border-bottom: 1px solid #eee; text-align: center; }
    .row-pre { color: #ef4444; font-weight: bold; }
    .row-real { color: #16a34a; font-weight: bold; }
    .btn-add { background: #3b82f6; color: white; border: none; padding: 15px; border-radius: 8px; width: 100%; font-weight: bold; margin-top: 10px; cursor: pointer; }
    .btn-edit { background: #f59e0b; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; margin-right: 4px; }
    .btn-check { background: #10b981; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; margin-right: 4px; }
    .btn-del { background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
    .movie-tag { background: #333; padding: 5px 10px; border-radius: 20px; font-size: 11px; display: inline-flex; align-items: center; gap: 6px; margin: 2px; border: 1px solid #444; }
</style>
</head>
<body>

<div id="login-page">
    <div class="login-box">
        <h2>Cinema Admin</h2>
        <input type="email" id="loginEmail" placeholder="Email">
        <input type="password" id="loginPass" placeholder="Password">
        <button class="btn-login" onclick="login()">เข้าสู่ระบบ</button>
        <p id="loginError" style="color: #ff4444; font-size: 12px; margin-top: 10px;"></p>
    </div>
</div>

<div id="main-content">
    <div class="logout-bar">

    </div>

    <div class="header-section">

    <div class="filter-card">

        <div class="branch-selector-grid">

                </optgroup>
                <optgroup label="📍 เพชรเกษม-บางแค">

                </optgroup>
                <optgroup label="📍 เวสต์เกต-ราชพฤกษ์-แจ้งวัฒนะ">
                    <option>MAJOR CENTRAL WESTGATE</option>

                    <option>MAJOR ROBINSON RATCHAPRUK</option>
                    <option>SF CINEMA CENTRAL CHAENGWATTANA</option>
                    <option>SF CINEMA ROBINSON SRISAMAN</option>
                    <option>MAJOR BANGKADI</option>
                </optgroup>
                <optgroup label="📍 สมุทรปราการ-บางพลี">
                    <option>MAJOR CINEPLEX SAMRONG</option>
                    <option>MAJOR CINEPLEX SAMUTPRAKARN</option>
                    <option>EGV BIG C SAMUTPRAKARN</option>
                    <option>SF CINEMA BIG C BANGPLEE</option>
                    <option>SF CINEMA MARKET VILLAGE SUVARNABHUMI</option>
                    <option>MAJOR CINEPLEX LOTUS SAMUTPRAKARN</option>
                    <option>MAJOR CINEPLEX LOTUS SRINAKARIN</option>
                </optgroup>
                <optgroup label="📍 รามอินทรา-ลาดกระบัง">
                    <option>MAJOR PROMENADE (8)</option>

                    <option>SF CINEMA RAMINTRA</option>
                </optgroup>
                <optgroup label="📍 ไอคอนสยาม-พระราม 3">
                    <option>ICON</option>

                    <option>SFX CINEMA CENTRAL RAMA9</option>
                    <option>SF WORLD CINEMA CENTRAL WORLD</option>
                </optgroup>
                <optgroup label="📍 ศรีนครินทร์-บางนา-พระราม 2">
                    <option>MAJOR CINEPLEX MEGA BANGNA</option>

                    <option>SF CINEMA JAS URBAN SRINAKARIN</option>
                    <option>MAJOR CINEPLEX RAMA2</option>
                    <option>MAJOR CINEPLEX LOTUS RAMA2</option>
                    <option>MAJOR CINEPLEX LOTUS BANGPRAKOK</option>
                    <option>SF CINEMA THE MALL TAPRA</option>
                    <option>MAJOR CINEPLEX LOTUS BANGKAPI</option>

            </select>
        </div>
        <button class="btn-reset" onclick="resetBranch()">📊 ดูยอดรวมทุกสาขา</button>
    </div>

    <div id="advancedSummary" class="total-summary-box">
        <h4 id="summaryTitle" style="color:#facc15; margin-bottom:10px">📈 สรุปยอดรวม</h4>
        <table class="summary-table">
            <thead><tr><th>ชื่อภาพยนตร์</th><th>ระบบ/เสียง</th><th style="text-align:right">ยอดรวม (บาท)</th></tr></thead>

        </table>

    <div class="tabs">
        <button class="tab-btn active" id="tab1" onclick="switchPage(1)">รายได้หลัก</button>

    <div id="movieManagerBox" class="box">

            <button onclick="addMovie('main')" style="background:#3b82f6; border:none; padding:10px; border-radius:8px; color:white; width: 60px;">เพิ่ม</button>
        </div>
        <div id="list_tags_main" style="margin-bottom:15px"></div>
        <hr style="border-color:#333; margin: 15px 0;">
        <div style="display:flex; gap:5px; margin-bottom:10px">
            <input type="text" id="new_movie_side" placeholder="เพิ่มหนังรอง...">

    <div id="p1" class="page active">

                <select id="m_name_sel"></select>
                <select id="m_sys"><option>2D/TH</option><option>2D/EN</option><option>IMAX</option><option>4DX</option></select>
                <input type="number" id="m_the" placeholder="โรง">
                <input type="text" id="m_time" placeholder="เวลา (เช่น 14:00)">

                <input type="number" id="m_seat" placeholder="ที่นั่ง">
            </div>
            <button class="btn-add" id="btn_save1" onclick="saveData(1)">บันทึกรายได้หลัก</button>
            <button id="btn_cancel1" onclick="cancelEdit()" style="display:none; background:#666; color:white; border:none; padding:10px; border-radius:8px; width:100%; margin-top:5px;">ยกเลิกการแก้ไข</button>

            <div class="status-selector">

                <div id="st-real-2" class="status-btn real" onclick="setStatus(2,'REAL')">ปิดยอดจริง</div>
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px">
                <select id="c_movie_sel"></select>
                <input type="number" id="c_the" placeholder="โรง">
                <input type="number" id="c_rounds" placeholder="รอบ">

                <input type="number" id="c_view" placeholder="ผู้ชม">
            </div>

        </div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyAWew6J4gcIdNpF9iMWYUj0GztWrrOrZeM",
    authDomain: "newname-2e9f9.firebaseapp.com",
    databaseURL: "https://newname-2e9f9-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "newname-2e9f9",
    storageBucket: "newname-2e9f9.firebasestorage.app",
    messagingSenderId: "784301554225",
    appId: "1:784301554225:web:fcca1d2286f60ea5e0b310"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();

let rawP1 = [], rawP2 = [], moviesM = [], moviesS = [];
let stt1 = 'PRE', stt2 = 'PRE';
let currentEditIndex = null;

function login() {
    const email = document.getElementById('loginEmail').value;
    const pass = document.getElementById('loginPass').value;
    auth.signInWithEmailAndPassword(email, pass).catch(err => { document.getElementById('loginError').innerText = "❌ " + err.message; });
}
function logout() { auth.signOut(); }
auth.onAuthStateChanged(user => {
    if (user) {
        document.getElementById('login-page').style.display = 'none';
        document.getElementById('main-content').style.display = 'block';
        document.getElementById('userDisplay').innerText = `👤 ${user.email}`;
        init();
    } else {
        document.getElementById('login-page').style.display = 'flex';
        document.getElementById('main-content').style.display = 'none';
    }
});

function init() {
    const dl = document.getElementById('branchList');
    const dd = document.getElementById('branchDropdown');
    let opts = '';
    const allOptions = dd.querySelectorAll('option');
    allOptions.forEach(opt => { if(opt.value) opts += `<option value="${opt.value}">`; });
    dl.innerHTML = opts;

    if(!document.getElementById('targetDate').value) document.getElementById('targetDate').value = new Date().toISOString().split('T')[0];
    db.ref('settings/movies_main').on('value', s => { moviesM = s.val()||[]; updateMovieLists(); renderAll(); });
    db.ref('settings/movies_side').on('value', s => { moviesS = s.val()||[]; updateMovieLists(); renderAll(); });
    loadData();
}

function syncSearch() { document.getElementById('branchInput').value = document.getElementById('branchDropdown').value; renderAll(); }
function syncDropdown() {
    const val = document.getElementById('branchInput').value.toUpperCase();
    const dd = document.getElementById('branchDropdown');
    dd.value = ""; 
    for (let i = 0; i < dd.options.length; i++) if(dd.options[i].value === val) { dd.value = val; break; }
    renderAll();
}
function resetBranch() { document.getElementById('branchInput').value = ""; document.getElementById('branchDropdown').value = ""; cancelEdit(); renderAll(); }

function loadData() {
    const d = document.getElementById('targetDate').value;
    db.ref('data/'+d).on('value', s => {
        const v = s.val()||{};
        rawP1 = v.p1 || []; rawP2 = v.p2 || [];
        renderAll();
    });
}

function renderAll() {
    const search = document.getElementById('branchInput').value.trim().toUpperCase();
    const isTotal = (search === "");
    const activeTab = document.getElementById('tab1').classList.contains('active') ? 1 : 2;
    
    document.getElementById('movieManagerBox').style.display = isTotal ? 'block' : 'none';
    document.getElementById('advancedSummary').style.display = isTotal ? 'block' : 'none'; 
    document.getElementById('inputBox1').style.display = isTotal ? 'none' : 'block';
    document.getElementById('inputBox2').style.display = isTotal ? 'none' : 'block';
    
    let h1 = '', h2 = '', splitData = {};

    if (activeTab === 1) {
        rawP1.forEach(d => {
            if(!splitData[d.n]) splitData[d.n] = {}; 
            splitData[d.n][d.s] = (splitData[d.n][d.s] || 0) + (d.m || 0);
        });
    } else {
        rawP2.forEach(d => {
            if(!splitData[d.n]) splitData[d.n] = {}; 
            splitData[d.n]['ทั่วไป'] = (splitData[d.n]['ทั่วไป'] || 0) + (d.i || 0);
        });
    }

    rawP1.forEach((d, i) => {
        if(isTotal || d.b.toUpperCase() === search) {
            h1 += `<tr class="${d.stt==='REAL'?'row-real':'row-pre'}">
                <td>${d.stt==='REAL'?'จริง':'เบื้องต้น'}</td>
                <td>${d.b}</td><td>${d.n}</td><td>${d.s}</td><td>${d.the||'-'}</td><td>${d.tm||'-'}</td>
                <td>${(d.m||0).toLocaleString()}</td>
                <td>
                    ${d.stt==='PRE' ? `<button class="btn-check" title="ปิดยอดจริง" onclick="closeReal('p1',${i})">✅</button>` : ''}
                    <button class="btn-edit" onclick="editRow('p1',${i})">✏️</button>
                    <button class="btn-del" onclick="delItem('p1',${i})">✕</button>
                </td>
            </tr>`;
        }
    });

    rawP2.forEach((d, i) => {
        if(isTotal || d.b.toUpperCase() === search) {
            h2 += `<tr class="${d.stt==='REAL'?'row-real':'row-pre'}">
                <td>${d.stt==='REAL'?'จริง':'เบื้องต้น'}</td>
                <td>${d.b}</td><td>${d.n}</td><td>${d.the||'-'}</td><td>${d.r||'-'}</td>
                <td>${(d.i||0).toLocaleString()}</td><td>${d.v||0}</td>
                <td>
                    ${d.stt==='PRE' ? `<button class="btn-check" title="ปิดยอดจริง" onclick="closeReal('p2',${i})">✅</button>` : ''}
                    <button class="btn-edit" onclick="editRow('p2',${i})">✏️</button>
                    <button class="btn-del" onclick="delItem('p2',${i})">✕</button>
                </td>
            </tr>`;
        }
    });

    document.getElementById('tbody1').innerHTML = h1;
    document.getElementById('tbody2').innerHTML = h2;

    document.getElementById('summaryTitle').innerText = (activeTab===1)?"🎬 สรุปรายได้หลัก (รวมทุกสาขา)":"🍿 สรุปยอดข้างเคียง (รวมทุกสาขา)";
    let sHtml = '';
    Object.keys(splitData).sort().forEach(m => {
        let sys = splitData[m], keys = Object.keys(sys), total = 0;
        keys.forEach((s, idx) => { total += sys[s]; sHtml += `<tr>${idx===0?`<td rowspan="${keys.length+1}">${m}</td>`:''}<td>${s}</td><td style="text-align:right">${sys[s].toLocaleString()}</td></tr>`; });
        sHtml += `<tr style="background:#2a2a2a; color:#facc15; font-weight:bold;"><td colspan="2" style="text-align:right">รวม ${m}</td><td style="text-align:right">${total.toLocaleString()}</td></tr>`;
    });
    document.getElementById('summarySplitBody').innerHTML = sHtml || '<tr><td colspan="3" style="text-align:center">ไม่มีข้อมูล</td></tr>';
}

function saveData(p) {
    // 1. ดึงชื่อสาขาจาก Input/Dropdown ที่เลือกไว้
    const b = document.getElementById('branchInput').value.trim();
    
    if(!b) {
        alert("⚠️ กรุณาเลือกหรือพิมพ์ชื่อสาขาก่อนบันทึกข้อมูล");
        return;
    }

    if(p === 1) {
        const movieName = document.getElementById('m_name_sel').value;
        const theater = document.getElementById('m_the').value;
        const timeInput = document.getElementById('m_time').value.trim();
        
        if (!timeInput) return alert("กรุณาระบุเวลา");

        // เช็คซ้ำโดยดูจาก สาขา + โรง + เวลา
        const isDuplicate = rawP1.some((item, index) => {
            if (currentEditIndex !== null && index === currentEditIndex) return false;
            return item.b.toUpperCase() === b.toUpperCase() && 
                   item.the === theater && 
                   item.tm === timeInput;
        });

        if (isDuplicate) {
            alert(`⚠️ ข้อมูลซ้ำ: สาขา ${b} โรง ${theater} รอบ ${timeInput} มีในระบบแล้ว`);
            return;
        }

        const data = { 
            b: b, // บันทึกชื่อสาขาลงไปในก้อนข้อมูล
            n: movieName, 
            s: document.getElementById('m_sys').value, 
            the: theater, 
            tm: timeInput, 
            m: parseFloat(document.getElementById('m_money').value)||0, 
            seat: parseFloat(document.getElementById('m_seat').value)||0, 
            stt: stt1 
        };
        
        if(currentEditIndex !== null) rawP1[currentEditIndex] = data; 
        else rawP1.push(data);

    } else {
        // ส่วนของยอดข้างเคียง
        const data = { 
            b: b, 
            n: document.getElementById('c_movie_sel').value, 
            the: document.getElementById('c_the').value, 
            r: document.getElementById('c_rounds').value, 
            i: parseFloat(document.getElementById('c_income').value)||0, 
            v: parseInt(document.getElementById('c_view').value)||0, 
            stt: stt2 
        };
        if(currentEditIndex !== null) rawP2[currentEditIndex] = data; 
        else rawP2.push(data);
    }
    
    cancelEdit(); 
    sync(); // บันทึกลง Firebase
}
}

function editRow(page, index) {
    currentEditIndex = index;
    if(page === 'p1') {
        const d = rawP1[index];
        document.getElementById('m_name_sel').value = d.n;
        document.getElementById('m_sys').value = d.s;
        document.getElementById('m_the').value = d.the;
        document.getElementById('m_time').value = d.tm;
        document.getElementById('m_money').value = d.m;
        document.getElementById('m_seat').value = d.seat;
        setStatus(1, d.stt);
        document.getElementById('btn_save1').innerText = "💾 บันทึกการแก้ไข";
        document.getElementById('btn_cancel1').style.display = "block";
    } else {
        const d = rawP2[index];
        document.getElementById('c_movie_sel').value = d.n;
        document.getElementById('c_the').value = d.the;
        document.getElementById('c_rounds').value = d.r;
        document.getElementById('c_income').value = d.i;
        document.getElementById('c_view').value = d.v;
        setStatus(2, d.stt);
        document.getElementById('btn_save2').innerText = "💾 บันทึกการแก้ไข";
        document.getElementById('btn_cancel2').style.display = "block";
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function cancelEdit() {
    currentEditIndex = null;
    document.getElementById('btn_save1').innerText = "บันทึกรายได้หลัก";
    document.getElementById('btn_save2').innerText = "บันทึกยอดข้างเคียง";
    document.getElementById('btn_cancel1').style.display = "none";
    document.getElementById('btn_cancel2').style.display = "none";
    ['m_the','m_time','m_money','m_seat','c_the','c_rounds','c_income','c_view'].forEach(id => {
        const el = document.getElementById(id);
        if(el) el.value = '';
    });
}

function sync() { db.ref('data/'+document.getElementById('targetDate').value).set({ p1: rawP1, p2: rawP2 }); }
function closeReal(page, index) { if(page === 'p1') rawP1[index].stt = 'REAL'; else rawP2[index].stt = 'REAL'; sync(); }
function setStatus(p, s) { if(p===1) stt1=s; else stt2=s; document.getElementById('st-pre-'+p).classList.toggle('active', s==='PRE'); document.getElementById('st-real-'+p).classList.toggle('active', s==='REAL'); }
function switchPage(p) { cancelEdit(); document.getElementById('tab1').classList.toggle('active', p===1); document.getElementById('tab2').classList.toggle('active', p===2); document.getElementById('p1').classList.toggle('active', p===1); document.getElementById('p2').classList.toggle('active', p===2); renderAll(); }
function delItem(p, i) { if(confirm("ลบข้อมูลนี้ใช่หรือไม่?")) { if(p==='p1') rawP1.splice(i,1); else rawP2.splice(i,1); sync(); } }
function updateMovieLists() { document.getElementById('m_name_sel').innerHTML = moviesM.map(m => `<option>${m}</option>`).join(''); document.getElementById('c_movie_sel').innerHTML = moviesS.map(m => `<option>${m}</option>`).join(''); document.getElementById('list_tags_main').innerHTML = moviesM.map((m,i)=>`<span class="movie-tag">${m} <b onclick="removeMovie('main',${i})" style="color:red;cursor:pointer">✕</b></span>`).join(' '); document.getElementById('list_tags_side').innerHTML = moviesS.map((m,i)=>`<span class="movie-tag">${m} <b onclick="removeMovie('side',${i})" style="color:red;cursor:pointer">✕</b></span>`).join(' '); }
function addMovie(t) { const i = document.getElementById('new_movie_'+t); if(i.value) { if(t==='main') moviesM.push(i.value); else moviesS.push(i.value); db.ref('settings/movies_'+t).set(t==='main'?moviesM:moviesS); i.value=''; } }
function removeMovie(t, i) { if(t==='main') moviesM.splice(i,1); else moviesS.splice(i,1); db.ref('settings/movies_'+t).set(t==='main'?moviesM:moviesS); }
</script>
</body>
</html>
