<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบแจ้งยอดโรงหนัง Online (Full Custom)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans Thai', sans-serif; background: #121212; color: #e0e0e0; padding: 15px; min-height: 100vh; }
    
    /* Header & Filter */
    .header-section { text-align: center; margin-bottom: 20px; }
    .filter-card { background: #1e1e1e; padding: 15px; border-radius: 12px; border: 1px solid #333; margin-bottom: 15px; }
    .filter-card label { display: block; margin-bottom: 8px; color: #facc15; font-weight: bold; font-size: 14px; }
    
    select, input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: white; font-size: 14px; outline: none; }
    select:focus, input:focus { border-color: #facc15; }

    /* Tabs */
    .tabs { display: flex; gap: 5px; margin-bottom: 15px; }
    .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; background: #333; color: #888; cursor: pointer; font-weight: bold; transition: 0.3s; }
    .tab-btn.active { background: #facc15; color: #000; }

    .page { display: none; }
    .page.active { display: block; }

    /* Cards & Stats */
    .box { background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #333; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    .stat-card { background: #262626; padding: 15px; border-radius: 10px; text-align: center; border-bottom: 4px solid #facc15; }
    .stat-label { font-size: 11px; color: #aaa; text-transform: uppercase; margin-bottom: 5px; }
    .stat-value { font-size: 18px; font-weight: bold; color: #fff; }

    /* Table */
    .table-container { overflow-x: auto; background: #fff; border-radius: 10px; }
    table { width: 100%; border-collapse: collapse; color: #333; font-size: 13px; min-width: 800px; }
    th { background: #444; color: white; padding: 12px; text-align: center; }
    td { padding: 10px; border-bottom: 1px solid #eee; text-align: center; }
    tr:nth-child(even) { background: #f9f9f9; }
    .del-btn { background: #ff4d4d; color: white; border: none; padding: 5px 8px; border-radius: 4px; cursor: pointer; }

    /* Movie Manager */
    .movie-manager { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .movie-tag { background: #333; padding: 5px 10px; border-radius: 20px; font-size: 12px; display: flex; align-items: center; gap: 8px; border: 1px solid #444; }
    .movie-tag span { cursor: pointer; color: #ff4d4d; font-weight: bold; }

    .btn-add { background: #22c55e; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; margin-top: 10px; cursor: pointer; }
    .sound-sum { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
    .sound-item { background: #2a2a2a; padding: 8px 12px; border-radius: 6px; font-size: 12px; border-left: 3px solid #3b82f6; }
</style>
</head>
<body>

<div class="header-section">
    <h2 style="color:#facc15">Cinema Report System</h2>
    <p style="font-size:12px; color:#666">โครงการ: Newnane | Real-time Database</p>
</div>

<div class="filter-card">
    <label>📅 เลือกวันที่และสาขา</label>
    <div style="display: flex; gap: 10px;">
        <input type="date" id="targetDate" onchange="loadData()">
        <select id="branchSelector" onchange="renderAll()">
            <option value="TOTAL">--- ดูยอดรวมทุกสาขา ---</option>
            <optgroup label="📍 นนทบุรี / ติวานนท์">
                <option value="ESPLANADE RATTANATIBATE">ESPLANADE RATTANATIBATE</option>
                <option value="MAJOR CHARN CHANGWATTHANA">MAJOR CINEPLEX CHARN CHANGWATTHANA</option>
                <option value="MAJOR HOLLYWOOD CHANGWATTHANA">MAJOR HOLLYWOOD CHANGWATTHANA</option>
                <option value="MAJOR TIWANON">MAJOR CINEPLEX TIWANON</option>
            </optgroup>
            <optgroup label="📍 เชียงใหม่">
                <option value="MAJOR FESTIVAL CHIANGMAI">MAJOR CINEPLEX FESTIVAL CHIANGMAI</option>
                <option value="MAJOR AIRPORT CHIANGMAI">MAJOR CINEPLEX AIRPORT CHIANGMAI</option>
                <option value="SF MAYA CHIANGMAI">SF CINEMA MAYA CHIANGMAI</option>
            </optgroup>
            <optgroup label="📍 เพชรเกษม / บางแค">
                <option value="MAJOR PETCHAKASEM">MAJOR CINEPLEX PETCHAKASEM</option>
                <option value="SF THE MALL BANGKAE">SF CINEMA THE MALL BANGKAE</option>
                <option value="SF BIG C PETCHAKASEM">SF CINEMA BIG C PETCHAKASEM</option>
            </optgroup>
            <optgroup label="📍 รัชโยธิน / เลียบด่วน">
                <option value="MAJOR RATCHAYOTHIN">MAJOR CINEPLLEX RATCHAYOTHIN</option>
                <option value="MAJOR EASTVILLE">MAJOR EASTVILLE</option>
                <option value="SFX THE CRYSTAL EKAMAI-RAMINTRA">SFX THE CRYSTAL EKAMAI-RAMINTRA</option>
            </optgroup>
            <optgroup label="📍 เวสต์เกต / ราชพฤกษ์">
                <option value="MAJOR CENTRAL WESTGATE">MAJOR CENTRAL WESTGATE</option>
                <option value="SF COSMO BAZAAR">SF CINEMA COSMO BAZAAR</option>
                <option value="MAJOR ROBINSON RATCHAPRUK">MAJOR ROBINSON RATCHAPRUK</option>
                <option value="SF CENTRAL CHAENGWATTANA">SF CINEMA CENTRAL CHAENGWATTANA</option>
            </optgroup>
            <optgroup label="📍 สมุทรปราการ / บางพลี">
                <option value="MAJOR SAMRONG">MAJOR CINEPLEX SAMRONG</option>
                <option value="MAJOR SAMUTPRAKARN">MAJOR CINEPLEX SAMUTPRAKARN</option>
                <option value="EGV BIG C SAMUTPRAKARN">EGV BIG C SAMUTPRAKARN</option>
                <option value="SF BIG C BANGPLEE">SF CINEMA BIG C BANGPLEE</option>
                <option value="SF MARKET VILLAGE SUVARNABHUMI">SF CINEMA MARKET VILLAGE SUVARNABHUMI</option>
            </optgroup>
            <optgroup label="📍 รามอินทรา / รังสิต / ปทุมธานี">
                <option value="EGV RANGSIT">EGV RANGSIT</option>
                <option value="MAJOR RANGSIT">MAJOR CINEPLEX RANGSIT</option>
                <option value="MAJOR RANGSIT KLONG6">MAJOR CINEPLEX RANGSIT KLONG6</option>
                <option value="MAJOR LOTUS NAWANAKORN">MAJOR CINE PLEX LOTUS NAWANAKORN</option>
                <option value="SFX THE MALL NGAMWONGWAN">SFX CINEMA THE MALL NGAMWONGWAN</option>
                <option value="SF RAMINTRA">SF CINEMA RAMINTRA</option>
                <option value="MAJOR PATUMTANI">MAJOR CINEPLEX PATUMTANI</option>
                <option value="MAJOR BANGKADI">MAJOR BANGKADI</option>
                <option value="SF ROBINSON SRISAMAN">SF CINEMA ROBINSON SRISAMAN</option>
            </optgroup>
            <optgroup label="📍 อื่นๆ (ปิ่นเกล้า/ฝั่งธน/ในเมือง)">
                <option value="ICON">ICON CINECONIC</option>
                <option value="PARAGON CINEPLEX">PARAGON CINEPLEX</option>
                <option value="SF MBK CENTER">SF CINEMA MBK CENTER</option>
                <option value="QUARTIER CINEART">QUARTIER CINEART</option>
                <option value="WESTVILLE">WESTVILLE</option>
                <option value="SF THE CRYSTAL RATCHAPRUEK">SF CINEMA THE CRYSTAL RATCHAPRUEK</option>
                <option value="SF THE MALL TAPRA">SF CINEMA THE MALL TAPRA</option>
            </optgroup>
        </select>
    </div>
</div>

<div class="tabs">
    <button class="tab-btn active" id="tab1" onclick="switchPage(1)">คีย์รายได้หลัก</button>
    <button class="tab-btn" id="tab2" onclick="switchPage(2)">ยอดข้างเคียง</button>
</div>

<div id="p1" class="page active">
    <div class="box" id="inputBox1">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px">
            <input type="text" id="m_name" placeholder="ชื่อหนัง">
            <select id="m_sys">
                <option>2D/TH</option><option>2D/EN</option><option>IMAX</option><option>4DX</option>
            </select>
            <input type="number" id="m_the" placeholder="โรง">
            <input type="text" id="m_round" placeholder="รอบ (เช่น 14:00)">
            <input type="number" id="m_seat" placeholder="ที่นั่ง">
            <input type="number" id="m_money" placeholder="ยอดเงิน">
        </div>
        <button class="btn-add" onclick="saveData1()">บันทึกข้อมูล</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><div class="stat-label">ยอดเงินรวม</div><div id="total1_money" class="stat-value">0</div></div>
        <div class="stat-card"><div class="stat-label">ที่นั่งรวม</div><div id="total1_seat" class="stat-value">0</div></div>
    </div>
    
    <div class="sound-sum" id="sound_p1"></div>

    <div class="table-container">
        <table>
            <thead><tr><th>สาขา</th><th>หนัง</th><th>ระบบ</th><th>โรง/รอบ</th><th>ยอด</th><th>ลบ</th></tr></thead>
            <tbody id="tbody1"></tbody>
        </table>
    </div>
</div>

<div id="p2" class="page">
    <div class="box">
        <label style="font-size:12px; color:#facc15">🎬 จัดการรายชื่อหนัง</label>
        <div style="display:flex; gap:5px; margin-bottom:10px">
            <input type="text" id="new_movie_name" placeholder="เพิ่มชื่อหนังใหม่ที่นี่...">
            <button onclick="addMovieName()" style="background:#3b82f6; border:none; padding:10px; border-radius:8px; color:white; cursor:pointer">เพิ่ม</button>
        </div>
        <div class="movie-manager" id="movie_list_tags"></div>
    </div>

    <div class="box" id="inputBox2">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px">
            <select id="c_movie"></select>
            <select id="c_sys"><option>2D/TH</option><option>2D/EN</option><option>IMAX</option></select>
            <input type="number" id="c_rounds" placeholder="จำนวนรอบ">
            <input type="number" id="c_income" placeholder="รายได้">
            <input type="number" id="c_view" placeholder="ผู้ชม">
        </div>
        <button class="btn-add" onclick="saveData2()">บันทึกยอดข้างเคียง</button>
    </div>

    <div class="sound-sum" id="sound_p2"></div>

    <div class="table-container">
        <table>
            <thead><tr><th>สาขา</th><th>หนัง</th><th>ระบบ</th><th>รอบ</th><th>รายได้</th><th>ผู้ชม</th><th>ลบ</th></tr></thead>
            <tbody id="tbody2"></tbody>
        </table>
    </div>
</div>

<script>
// Firebase Config
const firebaseConfig = {
    apiKey: "AIzaSyBGDiT7wGEnigYpAp7Q3nUNiLNHtcKYEDI",
    authDomain: "newnane-fe1b7.firebaseapp.com",
    databaseURL: "https://newnane-fe1b7-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "newnane-fe1b7",
    storageBucket: "newnane-fe1b7.firebasestorage.app",
    messagingSenderId: "227043707783",
    appId: "1:227043707783:web:24b4c5b0e9f53e5661a122"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let rawData1 = [], rawData2 = [], customMovies = [];

function init() {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('targetDate').value = today;
    loadData();
    
    // Load Custom Movies
    db.ref('settings/movies').on('value', snap => {
        customMovies = snap.val() || ["Mortal Kombat 2", "Captain America"];
        renderMovieSettings();
    });
}

function loadData() {
    const date = document.getElementById('targetDate').value;
    db.ref('data/' + date).on('value', snap => {
        const val = snap.val() || {};
        rawData1 = val.p1 || [];
        rawData2 = val.p2 || [];
        renderAll();
    });
}

function renderAll() {
    const branch = document.getElementById('branchSelector').value;
    
    // กรองข้อมูล
    const f1 = (branch === "TOTAL") ? rawData1 : rawData1.filter(d => d.b === branch);
    const f2 = (branch === "TOTAL") ? rawData2 : rawData2.filter(d => d.b === branch);

    // ซ่อนช่องคีย์ถ้าดูยอดรวม
    document.getElementById('inputBox1').style.display = (branch === "TOTAL") ? 'none' : 'block';
    document.getElementById('inputBox2').style.display = (branch === "TOTAL") ? 'none' : 'block';

    // Render Table 1
    let h1 = '', m1 = 0, s1 = 0, snd1 = {};
    f1.forEach((d, i) => {
        h1 += `<tr><td>${d.b}</td><td>${d.n}</td><td>${d.s}</td><td>${d.t}/${d.r}</td><td>${d.m.toLocaleString()}</td><td><button class="del-btn" onclick="deleteData('p1',${i})">✕</button></td></tr>`;
        m1 += d.m; s1 += d.st;
        snd1[d.s] = (snd1[d.s] || 0) + d.m;
    });
    document.getElementById('tbody1').innerHTML = h1;
    document.getElementById('total1_money').innerText = m1.toLocaleString();
    document.getElementById('total1_seat').innerText = s1.toLocaleString();
    document.getElementById('sound_p1').innerHTML = Object.keys(snd1).map(k => `<div class="sound-item">${k}: ${snd1[k].toLocaleString()}</div>`).join('');

    // Render Table 2
    let h2 = '', snd2 = {};
    f2.forEach((d, i) => {
        h2 += `<tr><td>${d.b}</td><td>${d.n}</td><td>${d.s}</td><td>${d.r}</td><td>${d.i.toLocaleString()}</td><td>${d.v.toLocaleString()}</td><td><button class="del-btn" onclick="deleteData('p2',${i})">✕</button></td></tr>`;
        snd2[d.s] = (snd2[d.s] || 0) + d.i;
    });
    document.getElementById('tbody2').innerHTML = h2;
    document.getElementById('sound_p2').innerHTML = Object.keys(snd2).map(k => `<div class="sound-item">${k}: ${snd2[k].toLocaleString()}</div>`).join('');
}

// บันทึกข้อมูล
function saveData1() {
    const branch = document.getElementById('branchSelector').value;
    const item = {
        b: branch, n: document.getElementById('m_name').value, s: document.getElementById('m_sys').value,
        t: document.getElementById('m_the').value, r: document.getElementById('m_round').value,
        st: parseInt(document.getElementById('m_seat').value) || 0,
        m: parseFloat(document.getElementById('m_money').value) || 0
    };
    rawData1.push(item);
    sync();
}

function saveData2() {
    const branch = document.getElementById('branchSelector').value;
    const item = {
        b: branch, n: document.getElementById('c_movie').value, s: document.getElementById('c_sys').value,
        r: parseInt(document.getElementById('c_rounds').value) || 0,
        i: parseFloat(document.getElementById('c_income').value) || 0,
        v: parseInt(document.getElementById('c_view').value) || 0
    };
    rawData2.push(item);
    sync();
}

function sync() {
    const date = document.getElementById('targetDate').value;
    db.ref('data/' + date).set({ p1: rawData1, p2: rawData2 });
}

function deleteData(page, idx) {
    if(!confirm("ลบข้อมูลรายการนี้?")) return;
    if(page === 'p1') rawData1.splice(idx, 1);
    else rawData2.splice(idx, 1);
    sync();
}

// จัดการชื่อหนัง
function renderMovieSettings() {
    const container = document.getElementById('movie_list_tags');
    container.innerHTML = customMovies.map((m, i) => `
        <div class="movie-tag">${m} <span onclick="removeMovieName(${i})">✕</span></div>
    `).join('');
    
    document.getElementById('c_movie').innerHTML = customMovies.map(m => `<option value="${m}">${m}</option>`).join('');
}

function addMovieName() {
    const name = document.getElementById('new_movie_name').value.trim();
    if(name) {
        customMovies.push(name);
        db.ref('settings/movies').set(customMovies);
        document.getElementById('new_movie_name').value = '';
    }
}

function removeMovieName(idx) {
    customMovies.splice(idx, 1);
    db.ref('settings/movies').set(customMovies);
}

function switchPage(p) {
    document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById('p'+p).classList.add('active');
    document.getElementById('tab'+p).classList.add('active');
}

init();
</script>
</body>
</html>
